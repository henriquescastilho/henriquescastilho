name: Metrics

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  lines-of-code:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Compute LOC metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: henriquescastilho
          filename: metrics.lines.svg
          template: classic
          base: ""
          config_timezone: America/Sao_Paulo
          plugin_lines: yes
          plugin_lines_sections: base, repositories, history
          plugin_lines_history_limit: 5
          plugin_lines_repositories_limit: 6
          output_action: commit
          committer_branch: main
          committer_message: "chore(metrics): update LOC counter"
